<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallPub</title>
    <meta name="theme-color" content="#0f766e">
    <link rel="icon" href="./assets/callpub-mark.svg" type="image/svg+xml">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="./assets/app.css">
</head>

<body>
    <div id="appLoader" class="app-loader" role="status" aria-live="polite">
        <img src="./assets/callpub-mark.svg" alt="" class="loader-mark">
        <div class="loader-copy">
            <strong>Loading board</strong>
            <span>Preparing room and shared canvas</span>
        </div>
        <div class="loader-ring" aria-hidden="true"></div>
    </div>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <img src="./assets/callpub-mark.svg" alt="">
                </div>
                <div>
                    <h1 class="brand-title">CallPub</h1>
                    <p class="brand-subtitle">Calls, screen sharing, and a shared whiteboard</p>
                </div>
            </div>

            <div class="status-strip" role="status">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Starting P2P room...</span>
                <span id="roomBadge" class="badge">room</span>
            </div>

            <div class="room-join" aria-label="Join room">
                <input id="roomInput" class="field" type="text" autocomplete="off" spellcheck="false" placeholder="Room ID">
                <button id="joinBtn" class="btn icon primary" type="button" title="Join room">
                    <i data-lucide="log-in"></i>
                </button>
            </div>

            <div class="top-actions">
                <button id="copyLinkBtn" class="btn primary" type="button" title="Copy invite link">
                    <i data-lucide="link" class="icon-small"></i>
                    Invite
                </button>
                <button id="newRoomBtn" class="btn" type="button" title="Create a new invite link">
                    <i data-lucide="plus" class="icon-small"></i>
                    New Link
                </button>
                <button id="newBoardBtn" class="btn" type="button" title="Start a blank board">
                    <i data-lucide="file-plus-2" class="icon-small"></i>
                    New Board
                </button>
            </div>
        </header>

        <main class="shell">
            <section id="boardWrap" class="workspace board" aria-label="Online whiteboard">
                <div class="board-toolbar" aria-label="Whiteboard toolbar">
                    <div class="toolbar-group tool-grid" aria-label="Tools">
                        <button class="btn tool-btn active" type="button" data-tool="pen" title="Pen">
                            <i data-lucide="pencil" class="icon-small"></i>
                            <span class="label-text">Pen</span>
                        </button>
                        <button class="btn tool-btn" type="button" data-tool="eraser" title="Eraser">
                            <i data-lucide="eraser" class="icon-small"></i>
                            <span class="label-text">Eraser</span>
                        </button>
                        <div class="line-tool popover-host">
                            <button id="lineToolBtn" class="btn tool-btn" type="button" data-tool="line" title="Line">
                                <i data-lucide="minus" class="icon-small"></i>
                                <span class="label-text">Line</span>
                            </button>
                            <button id="lineMenuBtn" class="btn line-menu-btn" type="button" title="Line style" aria-expanded="false" aria-controls="linePopover">
                                <i data-lucide="chevron-down" class="icon-small"></i>
                                <span class="label-text">Line style</span>
                            </button>
                            <div id="linePopover" class="tool-popover line-popover hidden" role="menu" aria-label="Choose line style">
                                <button class="line-option active" type="button" data-line-style="plain" title="Line">
                                    <i data-lucide="minus" class="icon-small"></i>
                                    <span>Line</span>
                                </button>
                                <button class="line-option" type="button" data-line-style="end" title="Arrow">
                                    <i data-lucide="arrow-right" class="icon-small"></i>
                                    <span>Arrow</span>
                                </button>
                                <button class="line-option" type="button" data-line-style="start" title="Reverse arrow">
                                    <i data-lucide="arrow-left" class="icon-small"></i>
                                    <span>Reverse</span>
                                </button>
                                <button class="line-option" type="button" data-line-style="both" title="Double arrow">
                                    <i data-lucide="move-horizontal" class="icon-small"></i>
                                    <span>Double</span>
                                </button>
                            </div>
                        </div>
                        <button class="btn tool-btn" type="button" data-tool="rect" title="Rectangle">
                            <i data-lucide="square" class="icon-small"></i>
                            <span class="label-text">Shape</span>
                        </button>
                        <button class="btn tool-btn" type="button" data-tool="circle" title="Circle">
                            <i data-lucide="circle" class="icon-small"></i>
                            <span class="label-text">Circle</span>
                        </button>
                        <button class="btn tool-btn" type="button" data-tool="text" title="Text">
                            <i data-lucide="type" class="icon-small"></i>
                            <span class="label-text">Text</span>
                        </button>
                        <button class="btn tool-btn" type="button" data-tool="pointer" title="Pointer">
                            <i data-lucide="mouse-pointer-2" class="icon-small"></i>
                            <span class="label-text">Pointer</span>
                        </button>
                        <button class="btn tool-btn" type="button" data-tool="pan" title="Pan">
                            <i data-lucide="hand" class="icon-small"></i>
                            <span class="label-text">Pan</span>
                        </button>
                    </div>

                    <div class="toolbar-group popover-host" aria-label="Color">
                        <button id="colorToggle" class="btn tool-btn color-toggle" type="button" title="Color" aria-expanded="false" aria-controls="colorPopover">
                            <span id="currentColor" class="current-color" aria-hidden="true"></span>
                            <span class="label-text">Color</span>
                        </button>
                        <div id="colorPopover" class="tool-popover color-popover hidden" role="menu" aria-label="Choose color">
                            <div id="colorGrid" class="color-grid"></div>
                        </div>
                    </div>

                    <div class="toolbar-group popover-host" aria-label="Stroke size">
                        <button id="sizeToggle" class="btn tool-btn size-toggle" type="button" title="Stroke size" aria-expanded="false" aria-controls="sizePopover">
                            <span id="currentSizeDot" class="size-dot" aria-hidden="true"></span>
                            <span id="sizeValue" class="size-number">6</span>
                        </button>
                        <div id="sizePopover" class="tool-popover size-popover hidden" role="menu" aria-label="Choose stroke size">
                            <input id="sizeRange" type="range" min="2" max="36" value="6" title="Stroke size">
                            <div class="size-presets" aria-label="Stroke size presets">
                                <button class="size-preset" type="button" data-size="4" title="4 px"><span style="--dot-size: 4px"></span></button>
                                <button class="size-preset" type="button" data-size="8" title="8 px"><span style="--dot-size: 8px"></span></button>
                                <button class="size-preset" type="button" data-size="14" title="14 px"><span style="--dot-size: 14px"></span></button>
                                <button class="size-preset" type="button" data-size="24" title="24 px"><span style="--dot-size: 24px"></span></button>
                            </div>
                        </div>
                    </div>

                    <div class="toolbar-group action-grid" aria-label="Board actions">
                        <button id="undoBtn" class="btn action-btn" type="button" title="Undo">
                            <i data-lucide="undo-2" class="icon-small"></i>
                            <span class="label-text">Undo</span>
                        </button>
                        <button id="addImageBtn" class="btn action-btn" type="button" title="Add image">
                            <i data-lucide="image-plus" class="icon-small"></i>
                            <span class="label-text">Image</span>
                        </button>
                        <button id="downloadBtn" class="btn action-btn" type="button" title="Download PNG">
                            <i data-lucide="download" class="icon-small"></i>
                            <span class="label-text">PNG</span>
                        </button>
                        <button id="clearBtn" class="btn action-btn danger" type="button" title="Clear whiteboard">
                            <i data-lucide="trash-2" class="icon-small"></i>
                            <span class="label-text">Clear</span>
                        </button>
                    </div>

                    <div class="toolbar-group view-grid" aria-label="View controls">
                        <button id="zoomOutBtn" class="btn action-btn" type="button" title="Zoom out">
                            <i data-lucide="zoom-out" class="icon-small"></i>
                            <span class="label-text">Zoom out</span>
                        </button>
                        <button id="zoomResetBtn" class="btn zoom-reset" type="button" title="Reset view">
                            <span id="zoomValue">100</span>
                            <span class="label-text">Reset view</span>
                        </button>
                        <button id="zoomInBtn" class="btn action-btn" type="button" title="Zoom in">
                            <i data-lucide="zoom-in" class="icon-small"></i>
                            <span class="label-text">Zoom in</span>
                        </button>
                    </div>
                </div>
                <canvas id="boardCanvas"></canvas>
                <canvas id="previewCanvas"></canvas>
                <div id="objectLayer" class="object-layer" aria-label="Shape objects"></div>
                <div id="imageLayer" class="image-layer" aria-label="Image objects"></div>
                <div id="textLayer" class="text-layer" aria-label="Text objects"></div>
                <div id="cursorLayer" class="cursor-layer" aria-label="Remote cursors"></div>
                <input id="imageFileInput" class="hidden" type="file" accept="image/*" multiple>
            </section>

            <aside class="media-rail" aria-label="Media">
                <section class="section">
                    <h2 class="section-title">Call</h2>
                    <input id="displayNameInput" class="field" type="text" autocomplete="name" maxlength="32" placeholder="Your name">
                    <div id="participants" class="participants"></div>
                    <div class="call-controls">
                        <div class="call-device popover-host">
                            <button id="micToggleBtn" class="btn call-btn" type="button" title="Mute microphone">
                                <i data-lucide="mic"></i>
                            </button>
                            <button id="micMenuBtn" class="btn call-menu-btn" type="button" title="Choose microphone" aria-expanded="false" aria-controls="micPopover">
                                <i data-lucide="chevron-down" class="icon-small"></i>
                            </button>
                            <div id="micPopover" class="tool-popover device-popover hidden">
                                <label class="device-field">
                                    <span>Microphone</span>
                                    <select id="micSelect" class="field"></select>
                                </label>
                            </div>
                        </div>
                        <div class="call-device popover-host">
                            <button id="cameraToggleBtn" class="btn call-btn" type="button" title="Turn camera off">
                                <i data-lucide="video"></i>
                            </button>
                            <button id="cameraMenuBtn" class="btn call-menu-btn" type="button" title="Choose camera" aria-expanded="false" aria-controls="cameraPopover">
                                <i data-lucide="chevron-down" class="icon-small"></i>
                            </button>
                            <div id="cameraPopover" class="tool-popover device-popover hidden">
                                <label class="device-field">
                                    <span>Camera</span>
                                    <select id="cameraSelect" class="field"></select>
                                </label>
                            </div>
                        </div>
                        <div class="call-device speaker-device popover-host">
                            <button id="speakerMenuBtn" class="btn call-btn" type="button" title="Choose speakers" aria-expanded="false" aria-controls="speakerPopover">
                                <i data-lucide="volume-2"></i>
                            </button>
                            <div id="speakerPopover" class="tool-popover device-popover hidden">
                                <label class="device-field">
                                    <span>Speakers</span>
                                    <select id="speakerSelect" class="field"></select>
                                </label>
                            </div>
                        </div>
                        <button id="audioBtn" class="btn call-btn" type="button" title="Audio call">
                            <i data-lucide="phone"></i>
                        </button>
                        <button id="videoBtn" class="btn call-btn" type="button" title="Video call">
                            <i data-lucide="video"></i>
                        </button>
                        <button id="screenBtn" class="btn call-btn" type="button" title="Share screen">
                            <i data-lucide="screen-share"></i>
                        </button>
                        <button id="hangupBtn" class="btn call-btn danger" type="button" title="Hang up">
                            <i data-lucide="phone-off"></i>
                        </button>
                    </div>
                </section>

                <section id="streams" class="streams">
                    <div id="emptyStreams" class="empty-state">Video, remote audio, and screen shares will appear here.</div>
                </section>

                <section id="activity" class="activity" aria-label="Activity log"></section>
            </aside>
        </main>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <div id="objectContextMenu" class="object-context-menu hidden" role="menu" aria-label="Object arrangement">
        <button type="button" data-arrange="front" role="menuitem">
            <i data-lucide="bring-to-front" class="icon-small"></i>
            Bring to Front
        </button>
        <button type="button" data-arrange="forward" role="menuitem">
            <i data-lucide="move-up" class="icon-small"></i>
            Bring Forward
        </button>
        <button type="button" data-arrange="backward" role="menuitem">
            <i data-lucide="move-down" class="icon-small"></i>
            Send Backward
        </button>
        <button type="button" data-arrange="back" role="menuitem">
            <i data-lucide="send-to-back" class="icon-small"></i>
            Send to Back
        </button>
    </div>
    <div id="streamViewer" class="stream-viewer hidden" role="dialog" aria-modal="true" aria-label="Expanded stream">
        <div class="stream-viewer-bar">
            <span id="streamViewerTitle">Stream</span>
            <div class="stream-viewer-actions">
                <button id="fullscreenStreamBtn" class="btn icon" type="button" title="Full screen">
                    <i data-lucide="maximize"></i>
                </button>
                <button id="closeStreamViewerBtn" class="btn icon" type="button" title="Collapse">
                    <i data-lucide="minimize-2"></i>
                </button>
            </div>
        </div>
        <div id="streamViewerSlot" class="stream-viewer-slot"></div>
    </div>

    <script src="./assets/app.js"></script>
</body>

</html>
